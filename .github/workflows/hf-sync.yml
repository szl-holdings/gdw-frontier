name: Sync GDW to Hugging Face

on:
  pull_request:
    paths:
      - .github/scripts/publish_gdw_hf.py
      - .github/workflows/hf-sync.yml
      - app/**
      - ci/**
      - gdw_x/**
      - Dockerfile
      - README.md
      - pyproject.toml
  push:
    branches: [main]
    paths:
      - .github/scripts/publish_gdw_hf.py
      - .github/workflows/hf-sync.yml
      - app/**
      - ci/**
      - gdw_x/**
      - Dockerfile
      - README.md
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-provider-mutation-gdw-frontier
  cancel-in-progress: false

jobs:
  validate:
    name: Validate curated public deployment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact pull-request source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact publisher clients
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.23.0"
          "requests==2.32.5"

      - name: Validate exact curated deployment without Hub mutation
        run: >-
          python .github/scripts/publish_gdw_hf.py
          --source-root .
          --source-sha "${{ github.event.pull_request.head.sha }}"
          --output /tmp/gdw-hf-sync-validation.json
          --validate-only

      - name: Upload validation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdw-hf-sync-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/gdw-hf-sync-validation.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish and verify exact main source
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_ORG_TOKEN: ${{ secrets.HF_ORG_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      REPORT_PATH: /tmp/gdw-hf-sync.json
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact publisher clients
        run: >-
          python -m pip install --disable-pip-version-check
          "huggingface_hub==1.23.0"
          "requests==2.32.5"

      - name: Publish, restart, and verify provider runtime
        id: publish
        shell: bash
        run: |
          set +e
          python .github/scripts/publish_gdw_hf.py \
            --source-root . \
            --source-sha "$GITHUB_SHA" \
            --output "$REPORT_PATH" \
            --timeout-seconds 720 \
            --poll-seconds 15
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload secret-free deployment receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gdw-hf-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce source-bound terminal state
        if: always()
        env:
          EXIT_CODE: ${{ steps.publish.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$REPORT_PATH"
          code="${EXIT_CODE:-3}"
          if [ "$code" -ne 0 ]; then
            echo "::error::GDW Hugging Face deployment did not reach a source-bound terminal state."
            exit "$code"
          fi
          echo "GDW Hugging Face Space is running the published source and preserves operator authentication."

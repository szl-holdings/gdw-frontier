name: gdw-production-witness

on:
  repository_dispatch:
    types:
      - gdw-production-witness

permissions:
  contents: read

concurrency:
  group: gdw-production-witness
  cancel-in-progress: false

jobs:
  witness:
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'gdw-production-witness' &&
      github.repository == 'szl-holdings/gdw-frontier' &&
      github.event.repository.full_name == 'szl-holdings/gdw-frontier' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify trusted default-branch workflow source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EXPECTED_REPOSITORY: szl-holdings/gdw-frontier
          OBSERVED_REF: ${{ github.ref }}
          OBSERVED_REPOSITORY: ${{ github.repository }}
          OBSERVED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "repository_dispatch"
          test "$EVENT_ACTION" = "gdw-production-witness"
          test "$EXPECTED_REPOSITORY" = "$OBSERVED_REPOSITORY"
          test "$EXPECTED_REPOSITORY" = "$EVENT_REPOSITORY"
          test "$OBSERVED_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$OBSERVED_SHA"
          test -z "$(git status --porcelain=v1)"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install verifier
        run: python -m pip install -e .

      - name: Materialize protected witness credential
        shell: bash
        env:
          GDW_PRODUCTION_API_TOKEN: ${{ secrets.GDW_PRODUCTION_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GDW_PRODUCTION_API_TOKEN"
          umask 077
          printf '%s' "$GDW_PRODUCTION_API_TOKEN" > "$RUNNER_TEMP/gdw-production-api-token"

      - name: Verify exact public production identity and signed receipt
        env:
          GDW_API_TOKEN_SOURCE_FILE: ${{ runner.temp }}/gdw-production-api-token
          GDW_PRODUCTION_IMAGE_DIGEST: ${{ vars.GDW_PRODUCTION_IMAGE_DIGEST }}
          GDW_PRODUCTION_SOURCE_SHA: ${{ vars.GDW_PRODUCTION_SOURCE_SHA }}
          GDW_PRODUCTION_URL: ${{ vars.GDW_PRODUCTION_URL }}
        run: >-
          python ci/verify_remote_witness.py
          --public-url "$GDW_PRODUCTION_URL"
          --expected-source "$GDW_PRODUCTION_SOURCE_SHA"
          --expected-image "$GDW_PRODUCTION_IMAGE_DIGEST"
          --output output/proofs/remote-production-witness.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gdw-production-witness-${{ github.run_id }}
          path: output/proofs/remote-production-witness.json
          if-no-files-found: error
          retention-days: 90

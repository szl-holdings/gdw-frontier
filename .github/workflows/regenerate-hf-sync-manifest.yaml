name: Regenerate GDW HF-sync artifact weights

on:
  push:
    branches:
      - ops/hf-source-bound-sync
    paths:
      - .github/workflows/regenerate-hf-sync-manifest.yaml

permissions:
  contents: write

concurrency:
  group: gdw-hf-sync-manifest-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    name: Bind permanent HF sync workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ops/hf-source-bound-sync
          fetch-depth: 0

      - name: Regenerate exact artifact weights
        run: |
          set -euo pipefail
          python ci/update_weight_manifest.py --write
          python ci/update_weight_manifest.py --check

      - name: Commit manifest and remove the untracked-class helper
        env:
          BRANCH: ops/hf-source-bound-sync
        run: |
          set -euo pipefail
          git config user.name "SZL Holdings Automation"
          git config user.email "eng@szlholdings.com"
          git add weights/manifest.json
          git rm .github/workflows/regenerate-hf-sync-manifest.yaml
          git diff --cached --check
          git commit -s -m "chore(weights): bind protected Hugging Face sync"
          git push origin "HEAD:${BRANCH}"

name: gdw-verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GDW_API_TOKEN: gdw-ci-only-token-with-at-least-32-characters
  GDW_API_TOKEN_SOURCE_FILE: /tmp/gdw-ci-api-token
  GDW_RECEIPT_SIGNING_KEY_FILE: /tmp/gdw-ci-signing-key.pem
  GDW_RECEIPT_SIGNING_REQUIRED: "1"
  GDW_SECRETS_GID: "10002"
  GDW_SIGNING_KEY_SOURCE_FILE: /tmp/gdw-ci-signing-key.pem
  GRAFANA_ADMIN_PASSWORD: gdw-local-admin
  GRAFANA_ADMIN_PASSWORD_SOURCE_FILE: /tmp/gdw-ci-grafana-password

concurrency:
  group: gdw-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare ephemeral Compose secret files
        shell: bash
        run: |
          umask 077
          printf '%s\n' "$GDW_API_TOKEN" > "$GDW_API_TOKEN_SOURCE_FILE"
          printf '%s\n' "$GRAFANA_ADMIN_PASSWORD" > "$GRAFANA_ADMIN_PASSWORD_SOURCE_FILE"
          sudo chown "$(id -u):$GDW_SECRETS_GID" "$GDW_API_TOKEN_SOURCE_FILE" "$GRAFANA_ADMIN_PASSWORD_SOURCE_FILE"
          chmod 0440 "$GDW_API_TOKEN_SOURCE_FILE" "$GRAFANA_ADMIN_PASSWORD_SOURCE_FILE"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Generate ephemeral CI receipt-signing key
        run: |
          python ci/generate_signing_key.py --output "$GDW_SIGNING_KEY_SOURCE_FILE"
          sudo chown "$(id -u):$GDW_SECRETS_GID" "$GDW_SIGNING_KEY_SOURCE_FILE"
          chmod 0440 "$GDW_SIGNING_KEY_SOURCE_FILE"

      - name: Unit tests
        run: pytest -q

      - name: Governed source gate
        run: python ci/gdw_gate.py --with-docker

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8

      - name: Terraform format and schema
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform validate

      - name: Prometheus config and rules
        run: |
          docker run --rm \
            -v "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.13.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/monitoring:/etc/prometheus:ro" \
            --entrypoint promtool \
            prom/prometheus:v3.13.1 \
            check rules /etc/prometheus/alerting-rules.yml

  integration:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GDW_REQUIRE_AUTH: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare ephemeral Compose secret files
        shell: bash
        run: |
          umask 077
          printf '%s\n' "$GDW_API_TOKEN" > "$GDW_API_TOKEN_SOURCE_FILE"
          printf '%s\n' "$GRAFANA_ADMIN_PASSWORD" > "$GRAFANA_ADMIN_PASSWORD_SOURCE_FILE"
          sudo chown "$(id -u):$GDW_SECRETS_GID" "$GDW_API_TOKEN_SOURCE_FILE" "$GRAFANA_ADMIN_PASSWORD_SOURCE_FILE"
          chmod 0440 "$GDW_API_TOKEN_SOURCE_FILE" "$GRAFANA_ADMIN_PASSWORD_SOURCE_FILE"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Generate ephemeral CI receipt-signing key
        run: |
          python ci/generate_signing_key.py --output "$GDW_SIGNING_KEY_SOURCE_FILE"
          sudo chown "$(id -u):$GDW_SECRETS_GID" "$GDW_SIGNING_KEY_SOURCE_FILE"
          chmod 0440 "$GDW_SIGNING_KEY_SOURCE_FILE"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install Newman
        run: npm install --global newman@6.2.1

      - name: Start complete stack
        run: docker compose -f monitoring/docker-compose.yml up -d --build

      - name: Verify metrics, logs, traces, dashboard, and alerts
        run: python ci/verify_stack.py

      - name: Measure bounded authenticated write load
        run: >-
          python ci/measure_load.py
          --public-url http://127.0.0.1:8080
          --api-token-file "$GDW_API_TOKEN_SOURCE_FILE"
          --requests 40
          --concurrency 4
          --allow-http-loopback
          --output output/proofs/load-measurement.json

      - name: Live cardinality budget
        run: >-
          python ci/audit_cardinality.py
          --metrics-url http://localhost:8080/metrics
          --baseline weights/cardinality-baseline.json

      - name: Postman contract smoke
        run: bash ci/newman_run.sh

      - name: Capture stack logs
        if: always()
        run: |
          mkdir -p output/proofs
          docker compose -f monitoring/docker-compose.yml logs --no-color > output/proofs/compose.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gdw-verification-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop stack
        if: always()
        run: docker compose -f monitoring/docker-compose.yml down --volumes --remove-orphans

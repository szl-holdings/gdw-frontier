name: Apply GDW public root repair

on:
  push:
    branches:
      - fix/public-root-operability
    paths:
      - .github/scripts/apply_public_root_fix.py
      - .github/workflows/apply-public-root-fix.yml

permissions:
  contents: write

concurrency:
  group: gdw-public-root-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Patch, test, and commit public root
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/public-root-operability
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact source and regression changes
        run: python .github/scripts/apply_public_root_fix.py

      - name: Install project and execute complete verification
        run: |
          python -m pip install --disable-pip-version-check -e '.[test]'
          pytest -q

      - name: Commit only permanent product changes
        env:
          BRANCH: fix/public-root-operability
        run: |
          set -euo pipefail
          git config user.name "SZL Holdings Automation"
          git config user.email "eng@szlholdings.com"
          git add app/api.py tests/test_api.py
          git diff --cached --check
          git commit -s -m "fix(api): expose read-only public root"
          git push origin "HEAD:${BRANCH}"

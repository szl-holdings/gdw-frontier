apiVersion: 1

deleteDatasources:
  - name: GDW Prometheus
    orgId: 1
  - name: GDW Loki
    orgId: 1
  - name: GDW Tempo
    orgId: 1

datasources:
  - name: GDW Prometheus
    uid: gdw-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: gdw-tempo

  - name: GDW Loki
    uid: gdw-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([a-f0-9]{32})"'
          datasourceUid: gdw-tempo
          url: '$${__value.raw}'

  - name: GDW Tempo
    uid: gdw-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: gdw-loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: gdw-prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
      serviceMap:
        datasourceUid: gdw-prometheus

